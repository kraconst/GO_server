version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: telecorp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telecorp
      POSTGRES_PASSWORD: telecorp_secret
      POSTGRES_DB: telecorp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecorp -d telecorp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

